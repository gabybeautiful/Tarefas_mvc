<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{titulo_da_pagina}}</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <h1>Digite a tarefa e a data de conclusão (opcional)</h1>

    <form method="POST"> <!--seleciona o método HTTP-->
        <input type="text" id="tituloTarefa" name="tituloTarefa" 
        values="{{tarefa_edicao.titulo if tarefa_edicao}}">
        <input type="date" id="dataConclusao" name="dataConclusao"
        value="{{tarefa_edicao.data_conclusao if tarefa_edicao}}">

        <button type="submit">
            {{'Adicionar' if not tarefa_edicao else 'Atualizar'}}</button>
    </form>
    <output id="listaTarefas"></output>

    <ul id="listaTarefas">
        {% for tarefa in tarefas_da_pagina %}
            <li>{{tarefa.titulo_tarefa}} - {{tarefa.data_conclusao}}
                <a href="{{url_for(' editar_id_especificado', 
                   id=tarefa.id=tarefa)}}">editar</a>
                <a href="{{url_for(' apagar_id_especificado',
                   id=tarefa.id=tarefa)}}">Apagar</a>  
            </li>
        {% endfor %}
        </ul>

</body>
</html>
